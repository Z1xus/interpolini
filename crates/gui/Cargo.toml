[package]
name = "interpolini"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[dependencies]
cpal = "0.18.2"
interpolini-core = { path = "../core" }
rfd = "0.17.2"
sevenz-rust2 = { version = "0.23.0", default-features = false }
sha2 = "0.11.0"
slint = { version = "1.18.1", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-femtovg", "renderer-software", "unstable-winit-030", "accessibility"] }
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[build-dependencies]
slint-build = "1.18.1"
winresource = "0.1.31"

[target.'cfg(target_os = "linux")'.dependencies]
wayland-backend = { version = "0.3.17", features = ["client_system"] }
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "staging"] }
