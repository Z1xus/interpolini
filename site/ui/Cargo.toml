[package]
name = "interpolini_ui"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[workspace]

[dependencies]
i-slint-backend-winit = { version = "1.18.1", default-features = false, features = ["renderer-femtovg"] }
slint = { version = "1.18.1", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-femtovg", "unstable-winit-030"] }
wasm-bindgen = "0.2.129"
web-sys = { version = "0.3", features = ["Document", "HtmlCanvasElement", "Window", "console"] }

[build-dependencies]
slint-build = "1.18.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

[dev-dependencies]
i-slint-backend-testing = "1.18.1"
