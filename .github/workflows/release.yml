name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            container: rust:1.98.0-bookworm@sha256:82150a52ec202c1b14d7817e14516c392bb7f5cfebd88f1ed531cb37ebd39922
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # the art of the themes is on its own branch
      - uses: actions/checkout@v7.0.1
        with:
          ref: assets
          path: target/art
          persist-credentials: false
      - name: Linux tools
        if: runner.os == 'Linux'
        run: |
          apt-get update
          apt-get install -y --no-install-recommends clang pkg-config unzip xz-utils \
            libasound2-dev libfontconfig-dev libxkbcommon-dev libwayland-dev libx11-dev libx11-xcb-dev libxcb1-dev
      - name: Windows tools
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VS_INSTALL=%%i"
          if not defined VS_INSTALL exit /b 1
          call "%VS_INSTALL%\VC\Auxiliary\Build\vcvarsall.bat" x64
          if errorlevel 1 exit /b 1
          echo PATH=%PATH%>> "%GITHUB_ENV%"
          echo LIB=%LIB%>> "%GITHUB_ENV%"
          echo INCLUDE=%INCLUDE%>> "%GITHUB_ENV%"
          echo VCINSTALLDIR=%VCINSTALLDIR%>> "%GITHUB_ENV%"
          echo VCToolsVersion=%VCToolsVersion%>> "%GITHUB_ENV%"
          echo VCToolsInstallDir=%VCToolsInstallDir%>> "%GITHUB_ENV%"
          echo WindowsSdkDir=%WindowsSdkDir%>> "%GITHUB_ENV%"
          echo WindowsSDKVersion=%WindowsSDKVersion%>> "%GITHUB_ENV%"
          echo LIBCLANG_PATH=%ProgramFiles%\LLVM\bin>> "%GITHUB_ENV%"
      - name: Build
        env:
          TARGET: ${{ matrix.target }}
        run: |
          bash .github/build.sh "$TARGET" dist
          # an artifact drops the mark of a program from its files, a tar keeps it
          tar -cf "$TARGET.tar" -C dist .
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ matrix.target }}
          path: ${{ matrix.target }}.tar
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          merge-multiple: true
      - name: Package
        env:
          TZ: UTC
        run: |
          mkdir dist
          for part in *.tar; do tar -xf "$part" -C dist; done
          cd dist
          for folder in */; do
            find "$folder" -exec touch -h -t 198001010000 {} +
            find "$folder" -type f -print0 | sort -z | xargs -0 zip -X -q "${folder%/}.zip"
          done
          sha256sum ./*.zip > SHA256SUMS
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/SHA256SUMS \
            --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
