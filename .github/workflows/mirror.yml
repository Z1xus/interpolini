name: Mirror

on:
  workflow_dispatch:
    inputs:
      tag:
        required: true
  workflow_call:
    inputs:
      tag:
        type: string
        required: true

permissions:
  contents: read

jobs:
  codeberg:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Codeberg
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          TOKEN: ${{ secrets.CODEBERG_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          api=https://codeberg.org/api/v1/repos/Z1xus/interpolini
          auth=(-H "Authorization: token $TOKEN")
          gh release download "$TAG" -D "$RUNNER_TEMP/dist"
          git push "https://Z1xus:$TOKEN@codeberg.org/Z1xus/interpolini.git" \
            'refs/remotes/origin/*:refs/heads/*' 'refs/tags/*:refs/tags/*'
          curl -sS "${auth[@]}" -X DELETE "$api/releases/tags/$TAG" > /dev/null
          id=$(gh release view "$TAG" --json tagName,body --jq '{tag_name: .tagName, name: .tagName, body}' |
            curl -sS --fail-with-body "${auth[@]}" -H 'Content-Type: application/json' -d @- "$api/releases" | jq .id)
          for file in "$RUNNER_TEMP"/dist/*; do
            curl -sS --fail-with-body "${auth[@]}" -F "attachment=@$file" "$api/releases/$id/assets?name=${file##*/}" > /dev/null
          done
          curl -sS --fail-with-body "${auth[@]}" "$api/releases?limit=50" | jq -r '.[5:][].tag_name' | while read -r tag; do
            curl -sS --fail-with-body "${auth[@]}" -X DELETE "$api/releases/tags/$tag"
          done
